<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2E9">
  <title>Shape Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=2">
  <link rel="stylesheet" href="./talk.css?v=1">
</head>
<body data-game="shape-attack">
  <main id="settingsScreen" class="app-shell screen">
    <header class="app-header">
      <div class="header-left"><a class="icon-btn" href="../../index.html" data-icon="house" aria-label="Shape Lab home" title="Shape Lab home"></a><h1 class="brand-name" id="brand">Shape Attack</h1></div>
      <div class="header-actions"><button id="fs1" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button></div>
    </header>
    <div class="settings-main">
      <section class="panel panel--card"><h2 class="panel-title" id="settingsTitle">Settings</h2><div id="settingsBody" class="settings-body"></div></section>
      <section class="panel panel--card"><h2 class="panel-title">Preview</h2><div id="preview" class="preview"></div><button id="startBtn" class="launch-btn" type="button">Start</button></section>
    </div>
  </main>

  <main id="playScreen" class="app-shell screen" hidden>
    <header class="app-header">
      <div class="header-left"><a class="icon-btn" href="../../index.html" data-icon="house" aria-label="Shape Lab home"></a><h1 class="brand-name" id="playTitle"></h1><div id="pips" class="pips"></div></div>
      <div class="header-actions">
        <button id="timerBtn" class="header-btn header-btn--accent" type="button"><span data-icon="play"></span>Start timer</button>
        <button id="gearBtn" class="icon-btn" type="button" data-icon="gear" aria-label="Settings" title="Settings"></button>
        <button id="fs2" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button>
      </div>
    </header>
    <div class="play-main">
      <section class="panel panel--card script-panel" id="script"></section>
      <section class="panel panel--card visual-panel"><div class="pic" id="pic"></div></section>
    </div>
    <div class="go-bar"><div class="timer-box" id="clock">0:00.0</div><div class="timer-box score-box" id="scoreBox" hidden>0</div><button id="nextBtn" class="big-btn" type="button" disabled>Next</button></div>
  </main>

  <main id="finishScreen" class="app-shell screen" hidden>
    <header class="app-header">
      <div class="header-left"><a class="icon-btn" href="../../index.html" data-icon="house" aria-label="Shape Lab home"></a><h1 class="brand-name" id="finTitle"></h1></div>
      <div class="header-actions"><button id="gear2" class="icon-btn" type="button" data-icon="gear" aria-label="Settings" title="Settings"></button><button id="fs3" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button></div>
    </header>
    <section class="panel panel--card finish-panel">
      <div class="wow" id="wow"></div><div class="final-time" id="finalTime"></div><div class="unit-label" id="unitLabel"></div>
      <div class="collage" id="collage"></div>
      <button id="finNext" class="launch-btn" type="button"></button>
    </section>
  </main>

  <main id="scoresScreen" class="app-shell screen" hidden>
    <header class="app-header">
      <div class="header-left"><a class="icon-btn" href="../../index.html" data-icon="house" aria-label="Shape Lab home"></a><h1 class="brand-name">Final scores</h1></div>
      <div class="header-actions"><button id="fs4" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen"></button></div>
    </header>
    <section class="panel panel--card scores-panel"><ol id="ranking" class="ranking"></ol>
      <div class="score-actions"><button id="againBtn" class="launch-btn" type="button">Play again</button><button id="toSettings" class="btn" type="button">Settings</button></div>
    </section>
  </main>
  <script type="module" src="./talk.js?v=1"></script>
</body>
</html>
